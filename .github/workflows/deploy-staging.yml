name: Build and Deploy Hospitalia Web

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  APP_NAME: 'hospitalia-web'

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      artifact-name: ${{ steps.package.outputs.ARTIFACT_NAME }}


    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      ###########################################
      # SDK + Tool Setup (Reusable Pattern)
      ###########################################

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm


      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9


      - name: Verify SDK Installation
        run: |
          echo "Node:"
          node -v

          echo "PNPM:"
          pnpm --version


      ###########################################
      # Build
      ###########################################

      - name: Install Dependencies
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile


      - name: Build Application
        run: |
          echo "🔨 Building Next.js project..."

          pnpm build

          echo "📦 Checking build output:"
          ls -la .next


      ###########################################
      # Validation (Same style as Backend)
      ###########################################

      - name: Verify Build Output
        run: |

          echo "🔍 Verifying Next.js build output..."

          if [ ! -d ".next" ]; then
            echo "❌ ERROR: .next directory does not exist"
            exit 1
          fi

          echo "Contents of .next:"
          ls -lh .next

          echo "✅ Build verified"



      ###########################################
      # Versioning (Reusable)
      ###########################################

      - name: Get artifact version
        id: version
        run: |

          VERSION=$(node -p "require('./package.json').version")

          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          echo "📌 Application version: $VERSION"



      ###########################################
      # Artifact Creation (Reusable Logic)
      ###########################################

      - name: Create Deployment Artifact
        id: package
        run: |

          mkdir -p artifacts

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          VERSION="${{ steps.version.outputs.VERSION }}"

          ARTIFACT_NAME="${{ env.APP_NAME }}-${VERSION}-${TIMESTAMP}.zip"

          echo "📦 Creating deployment package..."


          zip -r artifacts/$ARTIFACT_NAME \
            .next \
            public \
            package.json \
            pnpm-lock.yaml \
            next.config.* \
            ecosystem.config.* \
            .env.production 2>/dev/null || true


          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

          echo "📦 Artifact created:"
          ls -lh artifacts/



      ###########################################
      # Artifact Upload (Reusable)
      ###########################################

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospitalia-web-build
          path: artifacts/*.zip
          retention-days: 30
          if-no-files-found: error



  #################################################
  # DEPLOY JOB (Mirrors Backend Workflow)
  #################################################

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs: build

    if: github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch'


    steps:


      ###########################################
      # Download Artifact
      ###########################################

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hospitalia-web-build
          path: ./artifact



      ###########################################
      # Verify Artifact (Reusable)
      ###########################################

      - name: Verify downloaded artifact
        run: |

          echo "📦 Downloaded artifacts:"
          ls -lh artifact/

          COUNT=$(ls artifact/*.zip 2>/dev/null | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ ERROR: No artifact found"
            exit 1
          fi

          echo "✅ Artifact ready for deployment"



      ###########################################
      # SSH Setup (Reusable EXACT logic)
      ###########################################

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts



      - name: Test SSH Connection
        run: |
          echo "🔐 Testing SSH connection..."

          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "echo '✅ SSH connection successful' && whoami && pwd"



      ###########################################
      # Copy Artifact (Reusable EXACT style)
      ###########################################

      - name: Copy artifact to VPS
        run: |

          FILE=$(ls artifact/*.zip | head -1)

          if [ -z "$FILE" ]; then
            echo "❌ ERROR: No artifact found to deploy"
            exit 1
          fi

          echo "📦 Deploying: $(basename $FILE)"
          echo "📊 Size: $(du -h $FILE | cut -f1)"


          scp -i ~/.ssh/deploy_key -P ${{ secrets.VPS_PORT }} \
            "$FILE" \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/appl/apps/hospitalia-web/releases/


          echo "✅ Artifact copied to VPS"



      ###########################################
      # Cleanup (Reusable)
      ###########################################

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key



      ###########################################
      # Deployment Summary (Reusable EXACT style)
      ###########################################

      - name: Deployment Summary
        if: always()
        run: |
          echo "=================================="
          echo "Deployment Summary"
          echo "=================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Artifact: ${{ needs.build.outputs.artifact-name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=================================="

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Artifact uploaded successfully!"
          else
            echo "❌ Workflow failed."
          fi
